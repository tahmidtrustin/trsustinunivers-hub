<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Arena Fighter</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03050b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:999999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,rgba(50,25,100,.35),#03050b 75%);
}

.panel{
    width:min(900px,94vw);
    padding:30px;
    border:1px solid rgba(139,92,246,.5);
    border-radius:22px;
    background:rgba(7,10,20,.96);
    box-shadow:0 0 60px rgba(139,92,246,.25);
}

.logo{
    color:#06b6d4;
    font-size:13px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:8px;
}

h1{
    margin:0;
    font-size:clamp(38px,6vw,68px);
    font-weight:900;
}

.sub{
    color:#9da4b2;
    margin:10px 0 25px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.box{
    padding:18px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    background:rgba(255,255,255,.025);
}

.box-title{
    color:#9da4b2;
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:12px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.option{
    appearance:none;
    -webkit-appearance:none;
    display:block;
    width:100%;
    min-height:70px;
    padding:12px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    background:#0d1320;
    color:#fff;
    cursor:pointer;
    text-align:left;
    pointer-events:auto;
}

.option:hover{
    border-color:#ec4899;
}

.option.selected{
    border:2px solid #06b6d4;
    background:linear-gradient(
        135deg,
        rgba(6,182,212,.18),
        rgba(139,92,246,.18)
    );
}

.option strong{
    display:block;
    font-size:14px;
}

.option small{
    display:block;
    margin-top:6px;
    color:#8d96a7;
    font-size:10px;
}

#enterArena{
    display:block;
    width:100%;
    margin-top:20px;
    padding:17px;
    border:0;
    border-radius:13px;
    background:linear-gradient(90deg,#8b5cf6,#ec4899);
    color:#fff;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    pointer-events:auto;
}

#enterArena:hover{
    transform:translateY(-2px);
}

#status{
    text-align:center;
    margin-top:12px;
    min-height:18px;
    color:#06b6d4;
    font-size:12px;
    font-weight:800;
}

#game{
    display:none;
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,#101b32,#02040a);
    align-items:center;
    justify-content:center;
}

.gameText{
    text-align:center;
}

.gameText h2{
    font-size:50px;
    margin:0;
}

.gameText p{
    color:#9da4b2;
}

#backBtn{
    padding:12px 22px;
    border:1px solid #8b5cf6;
    border-radius:10px;
    background:#101625;
    color:#fff;
    cursor:pointer;
}

@media(max-width:650px){
    .grid{
        grid-template-columns:1fr;
    }

    .options{
        grid-template-columns:1fr 1fr;
    }

    .panel{
        padding:20px;
    }
}
</style>
</head>

<body>

<!-- ================= START MENU ================= -->

<div id="startScreen">

    <div class="panel">

        <div class="logo">
            VOLTLAB // COMBAT SYSTEM
        </div>

        <h1>NEON ARENA</h1>

        <div class="sub">
            Select your battlefield and weapon before entering the combat zone.
        </div>

        <div class="grid">

            <!-- MAP -->
            <div class="box">

                <div class="box-title">
                    SELECT MAP
                </div>

                <div class="options">

                    <button type="button"
                            class="option selected"
                            data-map="district">

                        <strong>🌆 Neon District</strong>

                        <small>
                            Urban night combat zone
                        </small>

                    </button>

                    <button type="button"
                            class="option"
                            data-map="dock">

                        <strong>🏭 Industrial Dock</strong>

                        <small>
                            Industrial battlefield
                        </small>

                    </button>

                    <button type="button"
                            class="option"
                            data-map="desert">

                        <strong>🏜️ Desert Outpost</strong>

                        <small>
                            Open tactical zone
                        </small>

                    </button>

                    <button type="button"
                            class="option"
                            data-map="lab">

                        <strong>🧪 Cyber Lab</strong>

                        <small>
                            Experimental facility
                        </small>

                    </button>

                </div>

            </div>

            <!-- WEAPON -->
            <div class="box">

                <div class="box-title">
                    SELECT WEAPON
                </div>

                <div class="options">

                    <button type="button"
                            class="option selected"
                            data-weapon="rifle">

                        <strong>🔫 Pulse Rifle</strong>

                        <small>
                            Balanced automatic weapon
                        </small>

                    </button>

                    <button type="button"
                            class="option"
                            data-weapon="shotgun">

                        <strong>💥 Shock Shotgun</strong>

                        <small>
                            High close-range damage
                        </small>

                    </button>

                    <button type="button"
                            class="option"
                            data-weapon="smg">

                        <strong>⚡ Volt SMG</strong>

                        <small>
                            Very fast fire rate
                        </small>

                    </button>

                    <button type="button"
                            class="option"
                            data-weapon="railgun">

                        <strong>☄️ Railgun</strong>

                        <small>
                            Extreme damage
                        </small>

                    </button>

                </div>

            </div>

        </div>

        <button type="button" id="enterArena">
            ENTER ARENA →
        </button>

        <div id="status">
            MAP: NEON DISTRICT &nbsp; | &nbsp; WEAPON: PULSE RIFLE
        </div>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="game">

    <div class="gameText">

        <h2>NEON ARENA</h2>

        <p id="gameInfo">
            Loading selected combat configuration...
        </p>

        <button type="button" id="backBtn">
            ← BACK TO LOADOUT
        </button>

    </div>

</div>


<script>

/* =========================================
   BASIC MENU SYSTEM
========================================= */

var selectedMap = "district";
var selectedWeapon = "rifle";

var mapNames = {
    district:"NEON DISTRICT",
    dock:"INDUSTRIAL DOCK",
    desert:"DESERT OUTPOST",
    lab:"CYBER LAB"
};

var weaponNames = {
    rifle:"PULSE RIFLE",
    shotgun:"SHOCK SHOTGUN",
    smg:"VOLT SMG",
    railgun:"RAILGUN"
};

var statusBox = document.getElementById("status");


/* =========================================
   MAP BUTTONS
========================================= */

var mapButtons = document.querySelectorAll("[data-map]");

for(var i=0;i<mapButtons.length;i++){

    mapButtons[i].addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        for(var j=0;j<mapButtons.length;j++){
            mapButtons[j].classList.remove("selected");
        }

        this.classList.add("selected");

        selectedMap = this.getAttribute("data-map");

        updateStatus();

    });

}


/* =========================================
   WEAPON BUTTONS
========================================= */

var weaponButtons = document.querySelectorAll("[data-weapon]");

for(var i=0;i<weaponButtons.length;i++){

    weaponButtons[i].addEventListener("click",function(e){

        e.preventDefault();
        e.stopPropagation();

        for(var j=0;j<weaponButtons.length;j++){
            weaponButtons[j].classList.remove("selected");
        }

        this.classList.add("selected");

        selectedWeapon = this.getAttribute("data-weapon");

        updateStatus();

    });

}


/* =========================================
   STATUS
========================================= */

function updateStatus(){

    statusBox.innerHTML =
        "MAP: " +
        mapNames[selectedMap] +
        " &nbsp; | &nbsp; WEAPON: " +
        weaponNames[selectedWeapon];

}


/* =========================================
   ENTER ARENA
========================================= */

document.getElementById("enterArena").addEventListener(
    "click",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        var startScreen =
            document.getElementById("startScreen");

        var game =
            document.getElementById("game");

        var gameInfo =
            document.getElementById("gameInfo");

        gameInfo.innerHTML =
            "MAP: <b>" +
            mapNames[selectedMap] +
            "</b><br><br>" +
            "WEAPON: <b>" +
            weaponNames[selectedWeapon] +
            "</b><br><br>" +
            "GAME ENGINE INITIALIZATION READY.";

        startScreen.style.display="none";

        game.style.display="flex";

    }
);


/* =========================================
   BACK
========================================= */

document.getElementById("backBtn").addEventListener(
    "click",
    function(){

        document.getElementById("game").style.display="none";

        document.getElementById("startScreen").style.display="flex";

    }
);

</script>

</body>
</html>
